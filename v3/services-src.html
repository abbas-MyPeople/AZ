.seen{font:700 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ticket);margin:30px 0 12px}

html[lang=ur] .sub,html[lang=hi] .sub,html[lang=ur] .seen,html[lang=hi] .seen,html[lang=ur] h1,html[lang=hi] h1,html[lang=ur] h2,html[lang=hi] h2{font-family:inherit;letter-spacing:0}

.group{margin-top:34px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.svc{position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:14px;cursor:pointer;min-height:44px}
.svc:hover{border-color:var(--deep)}
.svc input{position:absolute;opacity:0;width:1px;height:1px}

.box{grid-column:2;grid-row:1;width:24px;height:24px;border:1.5px solid var(--ink2);border-radius:5px;display:grid;place-items:center;font-size:15px;font-weight:800;color:transparent}
.svc:has(input:checked) .box{background:var(--brand);border-color:var(--brand);color:#fff}
.svc .line{grid-column:1/-1;font-size:.93rem;color:var(--ink2);margin:0}
.svc .price{grid-column:1/-1;font-size:.93rem;font-weight:700;margin:6px 0 0;font-variant-numeric:tabular-nums}
.svc .price small{display:block;font-weight:500;font-size:.84rem;color:var(--ink2)}

.terms{display:flex;flex-wrap:wrap;gap:6px 18px;margin:14px 0 0;padding:0;list-style:none;font-size:.95rem;font-weight:650}
.terms li::before{content:"\2713";color:var(--deep);margin-inline-end:6px;font-weight:800}
.proofs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:22px 0 0}
.proofs div{border-top:3px solid var(--ticket);padding-top:8px;font-size:14px;color:var(--ink2)}
.proofs b{display:block;font-size:24px;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.src{font-size:.84rem;color:var(--ink2);margin:26px 0 0}

.paid a{color:var(--deep)}

.bar.on{transform:none}
.bar .in{display:flex;align-items:center;gap:14px;justify-content:space-between}
.bar p{margin:0;font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.3}

.picks{margin:0 0 14px;padding:0;list-style:none;font-size:.95rem;color:var(--onslab2)}

form{display:grid;gap:8px}

.ferr{color:#ffb4a0;font-size:14px;margin:0}

.done h2{color:#9fe0c2}
.done p{margin:0 0 14px}
.sharebtns{display:flex;flex-wrap:wrap;gap:8px}

.sharebtns a:focus-visible,.sharebtns button:focus-visible{outline:2.5px solid #9fe0c2;outline-offset:2px}
footer{border-top:1px solid var(--rule);padding:16px 0;font-size:13.5px;color:var(--ink2);margin-top:38px}
footer a{color:var(--deep)}
@media (max-width:420px){.logo em{display:none}.bar a{padding:0 14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var qs=new URLSearchParams(location.search),SRC=["src","r","d","p"].map(function(k){var v=qs.get(k);return v?(k==="src"?v:k+v):"";}).filter(Boolean).join("-"),lang="en",picked={};
function $(id){return document.getElementById(id);}
function t(k){return T[lang][k]||T.en[k]||"";}
function track(n,p){try{window.azTrack&&window.azTrack(n,p);}catch(e){}}
function money(n){return "$"+(n%1?n.toFixed(2):n.toLocaleString("en-US"));}
function priceHtml(s){
  var a=[];
  if(s.custom)a.push(t("custom"));
  if(s.pct)a.push(s.pct+"% "+t("pct"));
  if(s.mo)a.push(money(s.mo)+" "+(s.unitMo?t("a"+s.unitMo):t("amo")));
  if(s.per)a.push(money(s.per)+" "+t("a"+s.unit));
  if(s.once)a.push(money(s.once)+" "+t("once"));
  if(s.setup)a.push(money(s.setup)+" "+t("setup"));
  var h='<span dir="auto">'+a.join(" · ")+"</span>";
  if(s.extra)h+="<small>"+t(s.extra)+"</small>";
  return h;
}
function draw(){
  var w=$("groups");w.innerHTML="";
  GROUPS.forEach(function(g){
    var sec=document.createElement("section");sec.className="group";
    var h=document.createElement("h2");h.textContent=t(g);sec.appendChild(h);
    var grid=document.createElement("div");grid.className="grid";
    S.filter(function(s){return s.g===g;}).forEach(function(s){
      var L=s.t[lang]||s.t.en,lab=document.createElement("label");lab.className="svc";
      lab.innerHTML='<input type="checkbox" data-id="'+s.id+'"'+(picked[s.id]?" checked":"")+'><b></b><span class="box" aria-hidden="true">&#10003;</span><p class="line"></p><p class="price">'+priceHtml(s)+"</p>"+(s.vs?'<p class="vs"></p>':"");
      if(BUY[s.id]){var bq=document.createElement("a");bq.className="buy";bq.href=BUY[s.id];bq.textContent=t("buy");bq.addEventListener("click",function(){track("buy_click",{service:s.id,price:s.once||0,src:SRC});});lab.appendChild(bq);}
      lab.querySelector("b").textContent=L[0];if(s.vs)lab.querySelector(".vs").textContent=s.vs[lang]||s.vs.en;lab.querySelector(".line").textContent=L[1];
      grid.appendChild(lab);
    });
    sec.appendChild(grid);w.appendChild(sec);
  });
  document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=t(el.getAttribute("data-i"));});
  document.querySelectorAll("[data-ph]").forEach(function(el){var v=t(el.getAttribute("data-ph"));el.placeholder=v;el.setAttribute("aria-label",v);});
  summary();
}
function ids(){return S.filter(function(s){return picked[s.id];}).map(function(s){return s.id;});}
function totals(){
  var o={mo:0,setup:0,per:false};
  ids().forEach(function(id){var s=S.filter(function(x){return x.id===id;})[0];o.mo+=s.mo||0;o.setup+=(s.setup||0)+(s.once||0);if(s.per)o.per=true;});
  return o;
}
function totalLine(){
  var o=totals(),a=[];
  if(o.mo)a.push(money(o.mo)+" "+t("tomonth"));
  if(o.per)a.push(t("plusper"));
  if(o.setup)a.push(money(o.setup)+" "+t("toset"));
  return a.join(" · ");
}
function shareUrl(){var i=ids();return location.origin+"/services/"+(i.length?"?s="+i.join(","):"")+"";}
function summary(){
  var i=ids(),ul=$("picks");ul.innerHTML="";
  if(!i.length){var e=document.createElement("li");e.textContent=t("nopick");ul.appendChild(e);}
  i.forEach(function(id){var s=S.filter(function(x){return x.id===id;})[0],li=document.createElement("li");li.textContent=(s.t[lang]||s.t.en)[0];ul.appendChild(li);});
  var tl=totalLine();
  if(tl){var li=document.createElement("li");li.className="tot";li.textContent=tl;ul.appendChild(li);}
  $("barT").innerHTML="";
  $("barT").appendChild(document.createTextNode(i.length+" "+t("picked")));
  var sm=document.createElement("small");sm.textContent=tl;$("barT").appendChild(sm);
  barState();
  $("shareRow").hidden=!i.length;
  $("shareWa").href="https://wa.me/?text="+encodeURIComponent(t("shareText")+" "+shareUrl());
}
var formSeen=false,sentDone=false;
function barState(){$("bar").classList.toggle("on",ids().length>0&&!formSeen&&!sentDone);}
if("IntersectionObserver" in window){new IntersectionObserver(function(en){formSeen=en[0].isIntersecting;barState();},{threshold:.15}).observe($("list"));}
$("groups").addEventListener("change",function(e){
  var c=e.target;if(!c.dataset||!c.dataset.id)return;
  var s=S.filter(function(x){return x.id===c.dataset.id;})[0];
  if(c.checked)picked[s.id]=1;else delete picked[s.id];
  track(c.checked?"service_add":"service_remove",{service:s.id,group:s.g,price_month:s.mo||0,price_setup:s.setup||0,price_once:s.once||0,src:SRC});
  summary();
});
$("lang").addEventListener("click",function(e){var b=e.target.closest("[data-lang]");if(!b)return;setLang(b.getAttribute("data-lang"),true);});
function setLang(l,user){
  lang=T[l]?l:"en";document.documentElement.lang=lang;document.documentElement.dir=lang==="ur"?"rtl":"ltr";
  document.querySelectorAll("#lang button").forEach(function(b){b.setAttribute("aria-pressed",String(b.getAttribute("data-lang")===lang));});
  try{localStorage.setItem("azlang",lang);}catch(e){}
  if(user)track("lang_change",{lang:lang});
  draw();
}
function fieldErr(input,errId,msg){$(errId).textContent=msg;if(msg)input.setAttribute("aria-invalid","true");else input.removeAttribute("aria-invalid");}
var checks=[["fName","eName",function(v){return v?"":t("err_name");}],["fRest","eRest",function(v){return v?"":t("err_rest");}],["fPhone","ePhone",function(v){return v.replace(/\D/g,"").length>=10?"":t("err_phone");}]];
checks.forEach(function(c){$(c[0]).addEventListener("input",function(){if($(c[1]).textContent)fieldErr($(c[0]),c[1],c[2]($(c[0]).value.trim()));});});
$("leadForm").addEventListener("submit",function(e){
  e.preventDefault();
  var first=null;checks.forEach(function(c){var m=c[2]($(c[0]).value.trim());fieldErr($(c[0]),c[1],m);if(m&&!first)first=$(c[0]);});
  if(first){first.focus();return;}
  var fd=new FormData(this),d={};fd.forEach(function(v,k){d[k]=String(v).trim();});
  var i=ids(),names=i.map(function(id){return S.filter(function(x){return x.id===id;})[0].t.en[0];}),o=totals();
  d.role="A restaurant owner";
  d.interests="Services: "+(names.join(", ")||"none picked");
  d.message="Sent from /services. Monthly $"+o.mo+", setup and one-time $"+o.setup+(o.per?", plus per order":"")+". Page language: "+lang+(d.wish?". Also wants: "+d.wish:"")+(SRC?". From: "+SRC:"");
  delete d.wish;
  d._website=d._honey||"";delete d._honey;
  d._subject="AZ services list - "+d.restaurant+" ("+i.length+")";
  d.source=(window.azSource&&window.azSource())||"direct / none";
  d._template="table";d._captcha="false";
  var btn=$("leadSend"),note=$("leadNote");btn.disabled=true;btn.textContent=t("sending");note.className="note";note.textContent=t("note");
  var meta={form:"services",picked:i.length,services:i.join(","),month:o.mo,setup:o.setup,src:SRC};
  track("form_submit",meta);
  fetch("https://wok-voice.fly.dev/gateway/form/az-lead",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(d)})
  .then(function(r){if(!r.ok)throw 0;return r.json();})
  .then(function(b){if(!b||b.received!==true)throw 0;
    sentDone=true;barState();
    $("formWrap").hidden=true;$("doneH").textContent=t("doneH");$("doneP").textContent=t("doneP").replace("{r}",d.restaurant).replace("{p}",d.phone);
    $("done").hidden=false;$("done").focus();track("form_success",meta);})
  .catch(function(){btn.disabled=false;btn.textContent=t("send");note.className="note err";note.textContent=t("fail");track("form_error",{form:"services"});});
});
$("shareWa").addEventListener("click",function(){track("list_share",{via:"whatsapp",picked:ids().length,services:ids().join(",")});});
$("shareCopy").addEventListener("click",function(){var b=this,u=shareUrl();
  function ok(){b.textContent=t("copied");setTimeout(function(){b.textContent=t("copy");},1600);track("list_share",{via:"copy",picked:ids().length,services:ids().join(",")});}
  if(navigator.clipboard)navigator.clipboard.writeText(u).then(ok,function(){});
});
(qs.get("s")||"").split(",").forEach(function(id){if(S.some(function(x){return x.id===id;}))picked[id]=1;});
var startLang="en";try{startLang=qs.get("lang")||localStorage.getItem("azlang")||"en";}catch(e){}
setLang(startLang,false);
var PAID=qs.get("paid");if(PAID==="photos"||PAID==="fees"){var pb=$("paid");$("paidH").textContent=t("paidH");$("paidP").textContent=t("paid_"+PAID);pb.hidden=false;pb.focus();track("buy_return",{service:PAID});}
track("services_view",{src:SRC,prefilled:ids().length});
})();
</script>
