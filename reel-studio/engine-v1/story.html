    Lq.push([x + y + h/2, () => { box(x+4, y+2, w-8, h-4, 0, 16, C.woodTop, C.wood, "#5d4026");

/* ---------- overlay pieces ---------- */

  ctx.translate(x, y); ctx.scale(k, k); ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;

}
function clockIcon(x, y, r, t, a) { if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
  ctx.fillStyle = C.cream; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.strokeStyle = C.spice; ctx.lineWidth = r*.12; ctx.stroke();
  ctx.strokeStyle = C.ink; ctx.lineCap = "round"; ctx.lineWidth = r*.1; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(t*6 - 1.57)*r*.7, Math.sin(t*6 - 1.57)*r*.7); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(t*.5)*r*.45, Math.sin(t*.5)*r*.45); ctx.stroke(); ctx.restore(); }
function title(b, t) {
  if (!b.title) return;
  const out1 = 1 - ease(span(t, b.t1 - .25, b.t1));
  ctx.save(); ctx.textAlign = "left"; ctx.shadowColor = "rgba(0,0,0,.65)"; ctx.shadowBlur = 26;

  words(b.title, 84, 270, "700 74px 'Playfair Display'", C.cream, t - b.t0 - .05, out1, 912, 84);
  ctx.restore();

/* a phone screen drawn in the site's own style, for screens that only exist after paying */
function receipt(cx, cy, w, a, t, addK, tapK) {

  ctx.save(); rr(x, y, w, h, 48); ctx.clip(); ctx.fillStyle = C.cream; ctx.fillRect(x, y, w, h);

/* the counter tablet, as counter_host.html draws it: Haniya greets, pickups with a four-step tracker */
const PICKS = [{name:"Priya", order:"1041", step:3, eta:"Ready"}, {name:"Omar", order:"1042", step:2, eta:"About 3 min"}, {name:"James", order:"1043", step:1, eta:"About 9 min"}];
const STAGES = ["Received", "Being made", "Almost ready", "Ready"];
function tablet(cx, cy, a, t) {

    ctx.fillStyle = C.ink; ctx.font = "700 30px Inter"; ctx.textAlign = "left"; ctx.fillText(p.name, x + 60, yy + 50);
    ctx.font = "500 20px Inter"; ctx.fillStyle = C.muted; ctx.fillText("#" + p.order + " · Pickup", x + 60, yy + 82);
    STAGES.forEach((s, k) => { const sx = x + 250 + k*130, on = k <= p.step, now = k === p.step && p.step < 3;

      ctx.font = "500 16px Inter"; ctx.fillStyle = on ? C.ink : "#a39a8f"; ctx.fillText(s, sx, yy + 80); });
    ctx.textAlign = "right"; ctx.font = "700 24px Inter"; ctx.fillStyle = p.step === 3 ? C.herb : C.ink; ctx.fillText(p.eta, x + w - 54, yy + 54);
    if (p.name === "Omar" && checked) { ctx.font = "600 18px Inter"; ctx.fillStyle = C.herb; ctx.fillText("You're checked in", x + w - 54, yy + 84); } });
  const tk = span(t, b3.t0 + 1.0, b3.t0 + 1.5); if (tk > 0 && tk < 1) { ctx.strokeStyle = `rgba(201,162,39,${1-tk})`; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(x + 120, y + 186 + 138 + 59, 24 + 60*tk, 0, 7); ctx.stroke(); }

    rr(dx + 400, dy + 172, 180, 78, 39); ctx.strokeStyle = C.line; ctx.lineWidth = 2; ctx.stroke(); ctx.fillStyle = C.ink; ctx.fillText("No", dx + 490, dy + 221);
    const yk = span(t, b4.t0 + .7, b4.t0 + 1.2); if (yk > 0 && yk < 1) { ctx.strokeStyle = `rgba(201,162,39,${1-yk})`; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(dx + 210, dy + 211, 24 + 60*yk, 0, 7); ctx.stroke(); } }
  ctx.restore(); ctx.restore();

/* the staff Ready board alert, staff dark tokens and its real wording */
function hereAlert(cx, cy, a, t) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; const w = 820, h = 230, x = cx - w/2, y = cy - h/2, pulse = .5 + .5*Math.sin(t*10);

  rr(x + 30, y + 74, w - 60, 124, 18); ctx.fillStyle = `rgba(201,162,39,${.25 + .2*pulse})`; ctx.fill(); ctx.strokeStyle = C.gold; ctx.lineWidth = 3; ctx.stroke();
  bell(x + 82, y + 134, t); ctx.fillStyle = "#fff"; ctx.font = "700 40px Inter"; ctx.fillText("Omar is here", x + 124, y + 148);
  ctx.textAlign = "right"; ctx.font = "600 24px Inter"; ctx.fillStyle = C.goldSoft; ctx.fillText("#1042 · Pickup", x + w - 60, y + 146);
  for (let i = 0; i < 3; i++) { const k = ((t*1.2) + i/3) % 1; ctx.strokeStyle = `rgba(201,162,39,${(1-k)*.5})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + 82, y + 134, 24 + 50*k, 0, 7); ctx.stroke(); }
  ctx.restore();
}
function endCard(t, a, b) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = "rgba(22,19,16,.88)"; ctx.fillRect(0, 0, W, H);
  const k = back(span(t, b.t0 + .1, b.t0 + .7)); if (IMG.logo) { const s = 300 * k; ctx.drawImage(IMG.logo, 540 - s/2, 640 - s/2, s, s); }
  ctx.textAlign = "center"; ctx.fillStyle = C.cream; ctx.font = "700 96px 'Playfair Display'"; ctx.fillText("Wok & Karahi", 540, 920);
  ctx.globalAlpha = a * out(span(t, b.t0 + .5, b.t0 + 1.0)); ctx.fillStyle = C.gold; ctx.font = "italic 700 48px 'Playfair Display'"; ctx.fillText(STORY === "dinein" ? "Less waving. More eating." : "No line. No guessing.", 540, 1000);
  pill("wokandkarahitexas.com", 540, 1120, C.spice, "#fff", "700 36px Inter", 40, 86); ctx.restore();
}

/* ---------- camera: [room x, room y, zoom] per beat ---------- */
const CAMS = STORY === "dinein"
  ? {hook:[150,128,2.6], turn:[150,128,2.0], ask:[141,131,2.0], eta:[141,131,1.9], more:[141,131,1.9], call:[170,140,1.8], end:[160,120,1.1]}
  : {hook:[260,195,2.0], turn:[240,205,2.6], list:[235,205,2.4], tap:[235,205,2.4], team:[262,190,2.2], end:[180,120,1.1]};
function camera(t) {
  const b = beatAt(t), i = BEATS.indexOf(b), prev = BEATS[Math.max(0, i-1)], from = CAMS[prev.id], to = CAMS[b.id];
  const k = i ? ease(span(t, b.t0, b.t0 + .7)) : 1, push = 1 + span(t, b.t0, b.t1) * .04;   // a slow push inside every beat
  return [lerp(from[0], to[0], k), lerp(from[1], to[1], k), lerp(from[2], to[2], k) * push];
}

/* ---------- the stories ---------- */
function dinein(t) {
  const hk = B("hook"), tu = B("turn"), as = B("ask"), et = B("eta"), mo = B("more"), cl = B("call"), en = B("end");
  const fed = t > cl.t1 - .6;
  // the runner: rushing past table 5 during the hook (never stopping), then coming when called
  let rx = 296, ry = 175, walk = false;
  if (t < tu.t0) { const k = ((t - hk.t0) / 2.2) % 1; walk = true; rx = lerp(290, 190, k < .5 ? ease(k*2) : ease(2 - k*2)); ry = 150 + 20*Math.sin(k*Math.PI); }
  else if (t > cl.vo + .9) { const k = span(t, cl.vo + .9, cl.vo + 2.2); walk = k < 1; rx = lerp(296, 160, ease(k)); ry = lerp(175, 158, ease(k)); }
  const fam = [["dad", .6], ["mom", .6], ["teen", -.6], ["kid", -.6]].map(([who, look], i) => { const [x, y] = seatPos(5, i, 4);
    return {x, y, seed: 60+i, dz: i%2 ? 1 : -1, o: {spec: CAST[who], look, scale: 1.12,
      raise: who === "dad" && t < tu.t0 + .3, phone: t > tu.t0 + .3 && t < cl.t1 && i !== 0, happy: fed ? 1 : 0, talk: who === "mom" && t > as.vo && t < as.vo + 1.6}}; });
  return {people: [...fam, {x: rx, y: ry, seed: 4, o: {spec: CAST.runner, scale: 1.1, walk, tray: t < tu.t0, look: 0, bag: false}}], table5food: fed};
}
function pickup(t) {
  const hk = B("hook"), tu = B("turn"), li = B("list"), tp = B("tap"), te = B("team");
  const line = [[284, 150, 31], [284, 172, 32]];                  // two people already in line
  let ox = 184, oy = 245, walk = false;                            // Omar comes in through the door
  const k1 = span(t, hk.t0, hk.t0 + 1.6); if (t < tu.t0) { ox = lerp(184, 284, ease(k1)); oy = lerp(245, 196, ease(k1)); walk = k1 > 0 && k1 < 1; }
  else { const k2 = span(t, tu.t0 + .2, tu.t0 + 1.3); ox = lerp(284, TAB[0] + 6, ease(k2)); oy = lerp(196, TAB[1] + 14, ease(k2)); walk = k2 > 0 && k2 < 1; }
  let rx = 300, ry = 26, rwalk = false, bag = false;                 // the runner, from the pass with the bag
  if (t > te.vo + .4) { const k = span(t, te.vo + .4, te.vo + 2.4); rx = lerp(300, TAB[0] + 24, ease(k)); ry = lerp(28, TAB[1] + 4, ease(k)); rwalk = k < 1; bag = true; }
  const people = line.map(([x, y, s]) => ({x, y, seed: s, o: {look: .9}}));
  people.push({x: ox, y: oy, seed: 70, o: {spec: {skin:"#8d5a3b", top:"#2f4a6b", hair:"cap", hc:"#1c1612", beard:true}, scale: 1.15, walk, look: t < tu.t0 ? .9 : .3, happy: t > te.vo + 2.2 ? 1 : 0, bag: t > te.vo + 2.6}});
  people.push({x: rx, y: ry, seed: 4, o: {spec: CAST.runner, scale: 1.1, walk: rwalk, bag: bag && t < te.vo + 2.6, look: 0}});
  return {people, tabletGlow: t > tu.t0 ? .6 + .4*Math.sin(t*4) : .15};
}

/* ---------- the frame ---------- */
function render(t) {
  ctx.setTransform(1,0,0,1,0,0);
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, "#0f0c0a"); g.addColorStop(.5, C.ink); g.addColorStop(1, "#0c0a08"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const actors = STORY === "dinein" ? dinein(t) : pickup(t);
  const [cxr, cyr, z] = camera(t), [fx, fy] = iso(cxr, cyr);
  ctx.save(); ctx.translate(W/2, 1150); ctx.scale(z, z); ctx.translate(-fx, -fy); room(t, actors); ctx.restore();
  const v = ctx.createRadialGradient(W/2, 1150, 300, W/2, 1150, 1250); v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(8,6,4,.85)"); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const tb = ctx.createLinearGradient(0, 0, 0, 520); tb.addColorStop(0, "rgba(12,10,8,.92)"); tb.addColorStop(1, "rgba(12,10,8,0)"); ctx.fillStyle = tb; ctx.fillRect(0, 0, W, 520);
  // where a character's head is on screen (for bubbles)
  const scr = (x, y, zz) => { const [px, py] = iso(x, y, zz); return [W/2 + (px - fx) * z, 1150 + (py - fy) * z]; };
  if (STORY === "dinein") {
    const hk = B("hook"), tu = B("turn"), as = B("ask"), et = B("eta"), mo = B("more"), cl = B("call"), en = B("end");
    // the hook: a raised hand, questions piling up, a clock
    const [dx, dy] = scr(...seatPos(5, 0, 4), 34);
    const qs = [["How long?", 1.0], ["Is it halal?", 1.7], ["One more lassi?", 2.4], ["Check, please!", 3.1]];
    qs.forEach(([q, at], i) => bubble(dx + [-160, 170, -120, 190][i], dy - 150 - i*96, q, win(t, hk.t0 + at - .8, tu.t0 + .2, .3), {font: "700 38px Inter"}));
    clockIcon(dx + 260, dy - 40, 46, t, win(t, hk.t0 + .4, tu.t0 + .2));
    // the turn: a gold flash, everything stops
    const fl = span(t, tu.t0, tu.t0 + .5); if (fl > 0 && fl < 1) { ctx.fillStyle = `rgba(243,231,196,${.55*(1 - fl)})`; ctx.fillRect(0, 0, W, H); }
    // ask: the real menu with Haniya, and an Urdu question answered in Urdu
    const pa = win(t, tu.t0 + .5, as.t1, .4);
    phone(IMG.menu, 540, 1180 + (1 - back(span(t, tu.t0 + .5, tu.t0 + 1.2))) * 900, 470, pa, {tap: span(t, as.t0 + .2, as.t0 + .7), tx: .9, ty: .58});
    bubble(380, 640, "کیا یہ حلال ہے؟", win(t, as.vo + .2, as.t1), {font: "600 40px 'Noto Nastaliq Urdu'", h: 110, dy: -6, rtl: true, sub: "Is this halal?", subc: C.goldSoft, tailX: 30});
    bubble(660, 880, "جی ہاں، سب کچھ ذبیحہ حلال ہے", win(t, as.vo + 1.3, as.t1), {font: "600 36px 'Noto Nastaliq Urdu'", h: 110, dy: -6, rtl: true, bg: C.herb, fg: "#fff", sub: "Yes, everything is Zabihah halal.", subc: C.goldSoft, tailX: -40});
    if (IMG.hav) { const hk2 = back(span(t, as.vo + 1.1, as.vo + 1.6)), a2 = win(t, as.vo + 1.1, as.t1); if (a2 > 0) { ctx.save(); ctx.globalAlpha = a2; ctx.beginPath(); ctx.arc(900, 1010, 70*hk2, 0, 7); ctx.clip(); ctx.drawImage(IMG.hav, 830, 940, 140, 140); ctx.restore();
      ctx.save(); ctx.globalAlpha = a2; ctx.strokeStyle = C.gold; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(900, 1010, 72*hk2, 0, 7); ctx.stroke(); ctx.restore(); } }
    // eta + more: the receipt screen
    const ra = win(t, et.t0 + .1, mo.t1, .4), addK = span(t, mo.vo + 1.5, mo.vo + 2.0);
    receipt(540, 1170 + (1 - out(span(t, et.t0 + .1, et.t0 + .6))) * 300, 470, ra, t, addK, span(t, mo.vo + .9, mo.vo + 1.4));
    sparkle(540, 1170 + 0, span(t, mo.vo + 1.5, mo.vo + 2.3), 10, 120);
    // call: the real Call staff sheet, then the runner arrives
    phone(IMG.call, 540, 1180, 440, win(t, cl.t0 + .1, cl.vo + 1.2, .35), {tap: span(t, cl.vo + .3, cl.vo + .8), tx: .5, ty: .855});
    if (t > cl.vo + 2.0) { const [rx2, ry2] = scr(160, 158, 50); sparkle(rx2, ry2, span(t, cl.vo + 2.0, cl.vo + 2.8), 8, 90); }
    // food lands: hearts
    if (t > cl.t1 - .6 && t < en.t0 + 1) for (let i = 0; i < 6; i++) { const ph = clamp((t - (cl.t1 - .6) - i*.15) / 1.4); if (ph <= 0 || ph >= 1) continue;
      const [hx, hy] = scr(141 + (i-2.5)*10, 131, 60 + ph*40); ctx.globalAlpha = 1 - ph; heart(hx + Math.sin(ph*6+i)*8, hy, 22, i % 2 ? C.spice : C.gold); ctx.globalAlpha = 1; }
    endCard(t, out(span(t, en.t0 + .4, en.t0 + .9)), en);
  } else {
    const hk = B("hook"), tu = B("turn"), li = B("list"), tp = B("tap"), te = B("team"), en = B("end");
    const [ox, oy] = scr(284, 196, 44);
    bubble(ox - 120, oy - 150, "Is mine ready?", win(t, hk.t0 + 1.8, tu.t0 + .2), {font: "700 42px Inter"});
    clockIcon(ox + 150, oy - 60, 44, t, win(t, hk.t0 + 2.4, tu.t0 + .2));
    const fl = span(t, tu.t0, tu.t0 + .5); if (fl > 0 && fl < 1) { ctx.fillStyle = `rgba(243,231,196,${.5*(1 - fl)})`; ctx.fillRect(0, 0, W, H); }
    tablet(540, 1180 + (1 - back(span(t, tu.t1 - .5, tu.t1 + .2))) * 1000, win(t, tu.t1 - .5, tp.t1, .35), t);
    if (t > tp.t0 + 1.2) sparkle(540, 980, span(t, tp.t0 + 1.2, tp.t0 + 2.0), 10, 140);
    hereAlert(540, 700, win(t, te.t0 + .1, te.vo + 2.0, .35), t);
    if (t > te.vo + 2.4) { const [bx, by] = scr(TAB[0] + 12, TAB[1] + 10, 50); sparkle(bx, by, span(t, te.vo + 2.4, te.vo + 3.2), 10, 100); }
    endCard(t, out(span(t, en.t0 + .4, en.t0 + .9)), en);
  }
  title(beatAt(t), t);
}
window.render = render;
window.frame = i => render(i / FPS);
if (!P.get("render")) READY.then(() => { const s = performance.now(); (function loop(){ render(((performance.now() - s) / 1000) % DURATION); requestAnimationFrame(loop); })(); });
</script></body></html>
