/* ---------- the call: a pulse of light that travels from the house to the phone ---------- */

const path = new THREE.CatmullRomCurve3([new THREE.Vector3(-7.3, 2.2, 32), new THREE.Vector3(-3, 4.5, 22), new THREE.Vector3(1.5, 3.2, 6), new THREE.Vector3(3.5, 3.6, -8), new THREE.Vector3(5.2, 2.6, -20.6)]);

/* ---------- HUD: drawn in 2D over the frame ---------- */

}

/* ---------- camera path, one continuous move ---------- */
const KEYS = [  // [time, position, look-at]
  [0,    [0, 16, 58],   [0, 3, 20]],
  [T[0].a + 1.4, [0, 4.2, 8], [0, 2.6, -16]],
  [T[0].end, [2, 3.0, -3],  [0, 2.2, -17]],
  [T[1].a + .6, [-1, 4.2, -10], [-2.5, 1.6, -19.5]],

  phone.rotation.z = ringing ? Math.sin(t * 60) * .06 : 0;

  wok.rotation.z = Math.sin(t * 7) * .25; chef.userData.armR.rotation.x = -1 + Math.sin(t*7) * .4;
  runner.position.x = 2 + Math.sin(t * .9) * 2.2; runner.position.z = -1 + Math.cos(t * .9) * .6; runner.rotation.y = Math.cos(t * .9) > 0 ? Math.PI/2 : -Math.PI/2;
  runner.position.y = Math.abs(Math.sin(t * 9)) * .06; front.userData.armL.rotation.x = -.8 + Math.sin(t * 3) * .2;

  coin.rotation.set(answered ? 0 : Math.sin(t*5) * .12, answered ? Math.sin(t*1.2) * .25 : -tilt * .9, answered ? 0 : -tilt * .5);
