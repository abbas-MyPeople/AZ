<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Your free check | AZ Restaurant Partners</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4efe6">
<link rel="icon" type="image/png" sizes="32x32" href="https://azrestaurantpartners.com/assets/brand/logo-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="https://azrestaurantpartners.com/assets/brand/logo-180.png">
<style>
:root{--ink:oklch(23% 0.012 60);--ink2:oklch(45% 0.010 60);--ink3:oklch(60% 0.010 60);--paper:oklch(97% 0.006 75);--surface:#fff;--surface2:oklch(93.5% 0.007 75);--rule:oklch(88% 0.008 70);
--deep:oklch(38% 0.070 160);--ticket:oklch(53% 0.150 32);--ticketsoft:oklch(95% 0.022 32);--brand:#1c4739;--onbrand:#fff;--onbrand2:#bcd8cc;
--mono:ui-monospace,"SF Mono",Menlo,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--serif:Georgia,"Iowan Old Style",serif;--r:7px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:oklch(94% 0.010 75);--ink2:oklch(78% 0.010 75);--ink3:oklch(63% 0.010 75);--paper:oklch(16% 0.008 70);--surface:oklch(20% 0.008 70);--surface2:oklch(25% 0.008 70);--rule:oklch(31% 0.009 70);--deep:oklch(76% 0.105 162);--ticket:oklch(70% 0.135 34);--ticketsoft:oklch(26% 0.045 32);color-scheme:dark}}
:root[data-theme="dark"]{--ink:oklch(94% 0.010 75);--ink2:oklch(78% 0.010 75);--ink3:oklch(63% 0.010 75);--paper:oklch(16% 0.008 70);--surface:oklch(20% 0.008 70);--surface2:oklch(25% 0.008 70);--rule:oklch(31% 0.009 70);--deep:oklch(76% 0.105 162);--ticket:oklch(70% 0.135 34);--ticketsoft:oklch(26% 0.045 32);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-wrap:anywhere}
a{color:var(--deep)}
:focus-visible{outline:2.5px solid var(--deep);outline-offset:3px}
nav{border-bottom:1px solid var(--rule);background:color-mix(in oklch,var(--paper) 88%,transparent);backdrop-filter:blur(12px);position:sticky;top:0;z-index:2}
.in{max-width:720px;margin:0 auto;padding:0 18px;width:100%}
.nav{display:flex;align-items:center;min-height:56px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:-.02em;text-decoration:none;color:var(--ink);font-size:16px}
.logo em{font-style:normal;font-weight:500;color:var(--ink2)}
main{padding:28px 0 8px}
.kick{font:700 11.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ticket);margin:0 0 10px}
h1{font-size:clamp(1.75rem,5.4vw,2.6rem);font-weight:830;letter-spacing:-.035em;line-height:1.08;margin:0 0 12px}
.lede{font-family:var(--serif);font-size:18.5px;color:var(--ink2);margin:0 0 6px;max-width:56ch}
.for{font-size:14px;color:var(--ink3);margin:0 0 24px}
h2{font-size:1.3rem;font-weight:790;letter-spacing:-.025em;margin:34px 0 10px;line-height:1.2}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:8px 0 6px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;border-top:3px solid var(--ticket)}
.stat b{display:block;font-size:1.65rem;font-weight:830;letter-spacing:-.03em;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{display:block;color:var(--ink);font-size:15px;line-height:1.4;margin-top:4px}
.stat small{display:block;color:var(--ink3);font-size:13px;line-height:1.4;margin-top:4px}
.intro{color:var(--ink2);margin:0 0 8px}
ul.items{list-style:none;padding:0;margin:0;border-top:1px solid var(--rule)}
ul.items li{padding:11px 0;border-bottom:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.mark{font:700 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:4px;padding:5px 6px;margin-top:3px;white-space:nowrap}
.mark.ok{background:color-mix(in oklch,var(--deep) 14%,transparent);color:var(--deep)}
.mark.fix{background:var(--ticketsoft);color:var(--ticket)}
.mark.dot{width:7px;height:7px;padding:0;border-radius:50%;background:var(--deep);margin-top:10px}
sup a{font:600 11px var(--mono);text-decoration:none;margin-left:2px}
.reply{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px;margin:0 0 12px}
.rmeta{font-size:13.5px;color:var(--ink3);margin:0 0 8px}
.rmeta b{color:var(--ink);font-weight:700}
blockquote{margin:0 0 10px;padding:0 0 0 12px;border-left:3px solid var(--rule);font-family:var(--serif);color:var(--ink2)}
.why{font-size:14.5px;color:var(--ink2);margin:0 0 12px}
.draft{background:var(--surface2);border-radius:6px;padding:12px 14px;margin:0 0 10px;white-space:pre-wrap}
.dlabel{font:700 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--deep);margin:0 0 6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:5px;font:700 15px var(--sans);border:1px solid var(--rule);background:transparent;color:var(--ink);cursor:pointer;text-decoration:none}
.btn-p{background:var(--brand);border-color:var(--brand);color:var(--onbrand)}
ol.fixes{list-style:none;counter-reset:f;padding:0;margin:0}
ol.fixes li{counter-increment:f;position:relative;padding:0 0 16px 46px}
ol.fixes li::before{content:counter(f);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
ol.fixes b{display:block;font-size:17px;line-height:1.35;margin:4px 0 2px}
ol.fixes span{color:var(--ink2)}
details{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:28px 0 0}
summary{cursor:pointer;list-style:none;padding:14px 0;font-weight:700;display:flex;justify-content:space-between;align-items:center;min-height:44px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:700 18px var(--mono);color:var(--ticket)}
details[open] summary::after{content:"-"}
ol.src{margin:0 0 14px;padding-left:22px;font-size:14.5px;color:var(--ink2)}
ol.src li{margin:0 0 6px}
.cta{background:var(--brand);color:var(--onbrand);border-radius:10px;padding:22px;margin:34px 0 0}
.cta h2{color:#fff;margin:0 0 6px}
.cta p{color:var(--onbrand2);margin:0 0 14px}
.cta .row{display:flex;gap:10px;flex-wrap:wrap}
.cta .btn{border-color:rgba(255,255,255,.4);color:#fff}
.cta .btn-w{background:#fff;color:var(--brand);border-color:#fff}
.who{font-size:14px;color:var(--onbrand2);margin:14px 0 0}
.state{padding:60px 0;text-align:left}
.state p{color:var(--ink2)}
.skel{height:14px;border-radius:4px;background:var(--surface2);margin:10px 0}
footer{border-top:1px solid var(--rule);padding:18px 0;margin-top:34px;font-size:13.5px;color:var(--ink3)}
@media (max-width:520px){.cta .row .btn{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav><div class="in nav"><a class="logo" href="/"><img src="https://azrestaurantpartners.com/assets/brand/logo-180.png" alt="" width="30" height="30">AZ <em>Restaurant Partners</em></a></div></nav>
<main><div class="in" id="app" aria-live="polite">
  <div class="state"><div class="skel" style="width:40%"></div><div class="skel" style="width:90%;height:30px"></div><div class="skel" style="width:75%"></div></div>
</div></main>
<footer><div class="in">AZ Restaurant Partners, Houston, Texas.</div></footer>
<script>
(function(){
var R=/*REPORT*/null;
var API="https://wok-voice.fly.dev/az-check/r/";
var NAMES={CALLS:"Rush-hour phone check",FEES:"Delivery app fee check",NOSHOW:"No-show cost check",MENU:"AI and Google visibility check",REVIEWS:"Review check"};
var app=document.getElementById("app");
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=String(txt);return e;}
function cite(node,src,n){(Array.isArray(src)?src:[]).forEach(function(i){var s=n[i-1];if(!s)return;var sp=el("sup"),a=el("a",null,"["+i+"]");a.href=s.url;a.rel="noopener nofollow";a.target="_blank";a.setAttribute("aria-label","Source "+i+": "+s.title);sp.appendChild(a);node.appendChild(sp);});}
function msg(h,p){app.innerHTML="";var d=el("div","state");d.appendChild(el("h1",null,h));var q=el("p");q.innerHTML=p;d.appendChild(q);app.appendChild(d);}
function render(r){
  var S=r.sources||[];
  document.title=(NAMES[r.check]||"Your free check")+" - "+r.restaurant+" | AZ Restaurant Partners";
  app.innerHTML="";
  app.appendChild(el("p","kick",NAMES[r.check]||"Free check"));
  app.appendChild(el("h1",null,r.headline));
  app.appendChild(el("p","lede",r.summary));
  app.appendChild(el("p","for","Prepared for "+r.restaurant+(r.city?", "+r.city:"")+(r.date?" on "+r.date:"")));
  if((r.stats||[]).length){var g=el("div","stats");r.stats.forEach(function(s){var c=el("div","stat"),b=el("b",null,s.value);c.appendChild(b);var sp=el("span",null,s.label);cite(sp,s.source,S);c.appendChild(sp);if(s.note)c.appendChild(el("small",null,s.note));g.appendChild(c);});app.appendChild(g);}
  (r.sections||[]).forEach(function(sec){
    app.appendChild(el("h2",null,sec.title));
    if(sec.intro)app.appendChild(el("p","intro",sec.intro));
    var ul=el("ul","items");
    (sec.items||[]).forEach(function(it){var li=el("li");
      var m=it.good===true?el("span","mark ok","OK"):it.good===false?el("span","mark fix","Fix"):el("span","mark dot");
      if(m.className.indexOf("dot")>-1)m.setAttribute("aria-hidden","true");
      li.appendChild(m);var t=el("div",null,it.text);cite(t,it.source,S);li.appendChild(t);ul.appendChild(li);});
    app.appendChild(ul);});
  if((r.replies||[]).length){
    app.appendChild(el("h2",null,"Reviews that need an answer"));
    r.replies.forEach(function(rp){var c=el("div","reply");
      var meta=el("p","rmeta");var b=el("b",null,(rp.site||"Review")+(rp.rating?" - "+rp.rating+" of 5 stars":""));meta.appendChild(b);
      meta.appendChild(document.createTextNode([rp.reviewer,rp.when].filter(Boolean).length?" - "+[rp.reviewer,rp.when].filter(Boolean).join(", "):""));cite(meta,rp.source,S);c.appendChild(meta);
      c.appendChild(el("blockquote",null,rp.quote));
      if(rp.why)c.appendChild(el("p","why",rp.why));
      c.appendChild(el("p","dlabel","A reply you could post"));
      var d=el("div","draft",rp.reply);c.appendChild(d);
      var bt=el("button","btn","Copy reply");bt.type="button";
      bt.addEventListener("click",function(){var done=function(){bt.textContent="Copied";setTimeout(function(){bt.textContent="Copy reply";},1600);};
        if(navigator.clipboard)navigator.clipboard.writeText(rp.reply).then(done,function(){});else{var ta=el("textarea");ta.value=rp.reply;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done();}catch(e){}ta.remove();}});
      c.appendChild(bt);app.appendChild(c);});}
  if((r.fixes||[]).length){
    app.appendChild(el("h2",null,r.fixes.length===3?"Three things to do":"What to do"));
    var ol=el("ol","fixes");r.fixes.forEach(function(f){var li=el("li");li.appendChild(el("b",null,f.title));li.appendChild(el("span",null,f.text));ol.appendChild(li);});app.appendChild(ol);}
  if(S.length){var dt=el("details"),sm=el("summary",null,"Where this comes from ("+S.length+")");dt.appendChild(sm);
    var o=el("ol","src");S.forEach(function(s){var li=el("li"),a=el("a",null,s.title);a.href=s.url;a.rel="noopener nofollow";a.target="_blank";li.appendChild(a);o.appendChild(li);});dt.appendChild(o);app.appendChild(dt);}
  var cta=el("div","cta");cta.appendChild(el("h2",null,"Want to talk any of this through?"));
  cta.appendChild(el("p",null,"I run my own restaurant and work on these same problems every day. Call or text me, or ask for a free demo on your own menu."));
  var row=el("div","row");var call=el("a","btn btn-w","Call (408) 393-6716");call.href="tel:+14083936716";row.appendChild(call);
  var st=el("a","btn","Ask for a free demo");st.href="/start/?src=check&k="+encodeURIComponent(r.check);row.appendChild(st);cta.appendChild(row);
  cta.appendChild(el("p","who","Abbas Zoeb, owner of Wok & Karahi in Spring and founder of AZ Restaurant Partners"));
  app.appendChild(cta);
}
if(R){render(R);return;}
var t=new URLSearchParams(location.search).get("r")||"";
if(!/^[A-Za-z0-9_-]{16,}$/.test(t)){msg("This link is not complete","Open the link from your email or text again. If it still does not work, <a href=\"/start/\">ask us for a new one</a>.");return;}
fetch(API+encodeURIComponent(t),{headers:{Accept:"application/json"}})
  .then(function(x){if(x.status===404)throw "gone";if(!x.ok)throw "net";return x.json();})
  .then(function(b){if(!b||!b.report)throw "gone";render(b.report);})
  .catch(function(e){if(e==="gone")msg("We could not find this check","The link may be mistyped. Open it from your email or text again, or <a href=\"/start/\">ask us for a new one</a>.");
    else msg("This page did not load","Check your connection and <a href=\"\">try again</a>.");});
})();
</script>
</body>
</html>
